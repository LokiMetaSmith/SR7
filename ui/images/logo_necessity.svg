<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="lawGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00ff" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f0714" />
      <stop offset="50%" stop-color="#1b0f24" />
      <stop offset="100%" stop-color="#0f0714" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="10" fill="url(#darkBg)" stroke="url(#lawGlow)" stroke-width="2" />

  <!-- Cyberpunk Scales / Grid -->
  <g stroke="#3a1c4a" stroke-width="1" opacity="0.7">
    <line x1="0" y1="20" x2="800" y2="20" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <path d="M 50 0 L 100 200 M 150 0 L 200 200 M 600 0 L 650 200 M 700 0 L 750 200" />
  </g>

  <!-- Scales of Justice Emblem on Left -->
  <g transform="translate(100, 100)" filter="url(#neonGlow)">
    <circle r="35" fill="none" stroke="url(#lawGlow)" stroke-width="2" />
    <!-- Center pillar -->
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#ffffff" stroke-width="3" />
    <!-- Cross beam -->
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#ffffff" stroke-width="3" />
    <!-- Left scale pan -->
    <line x1="-20" y1="-10" x2="-25" y2="10" stroke="#00ffff" stroke-width="1.5" />
    <line x1="-20" y1="-10" x2="-15" y2="10" stroke="#00ffff" stroke-width="1.5" />
    <line x1="-28" y1="10" x2="-12" y2="10" stroke="#00ffff" stroke-width="2.5" />
    <!-- Right scale pan -->
    <line x1="20" y1="-10" x2="15" y2="15" stroke="#ff00ff" stroke-width="1.5" />
    <line x1="20" y1="-10" x2="25" y2="15" stroke="#ff00ff" stroke-width="1.5" />
    <line x1="12" y1="15" x2="28" y2="15" stroke="#ff00ff" stroke-width="2.5" />
  </g>

  <!-- Typography -->
  <g transform="translate(180, 50)">
    <!-- Campaign Label -->
    <text x="0" y="20" font-family="'FuturaBT-Medium', 'Futura', sans-serif" font-size="14" font-weight="bold" fill="#ff00ff" letter-spacing="4">SHADOWRUN 7E NARRATIVE CAMPAIGN</text>

    <!-- Title -->
    <text x="0" y="75" font-family="'Impact', 'Aachen-Bold', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="1.5" filter="url(#neonGlow)">NECESSITY KNOWS NO LAW</text>

    <!-- Subtitle / Lore Hook -->
    <text x="2" y="110" font-family="'FrizQuadrataStd', Georgia, serif" font-size="15" font-style="italic" fill="#ccacd9">"Ghouls, labor camps, and corporate sovereignty clash in Zkazena."</text>
  </g>

  <!-- Geometric frame -->
  <path d="M 750 190 L 790 190 L 790 150" fill="none" stroke="#00ffff" stroke-width="3" />
</svg>
