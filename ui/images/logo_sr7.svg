<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="1" />
      <stop offset="50%" stop-color="#00ccff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0c0f" />
      <stop offset="50%" stop-color="#15191f" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="200" rx="10" fill="url(#darkBg)" stroke="url(#cyberGlow)" stroke-width="2" />

  <!-- Grid Lines Pattern (Cyberpunk vibe) -->
  <g stroke="#1a222d" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="100" y1="0" x2="100" y2="200" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="300" y1="0" x2="300" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="500" y1="0" x2="500" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="700" y1="0" x2="700" y2="200" />
  </g>

  <!-- Cybernetic Geometric Accents -->
  <path d="M 10 10 L 40 10 L 10 40 Z" fill="url(#cyberGlow)" opacity="0.8" />
  <path d="M 790 190 L 760 190 L 790 160 Z" fill="url(#cyberGlow)" opacity="0.8" />
  <line x1="15" y1="185" x2="150" y2="185" stroke="#ff007f" stroke-width="3" filter="url(#neonGlow)" />
  <circle cx="160" cy="185" r="3" fill="#ff007f" filter="url(#neonGlow)" />

  <!-- Main Logo Typography (Simulated Friz Quadrata / Aachen retro feel) -->
  <g transform="translate(50, 45)">
    <!-- Shadowrun Accent Header -->
    <text x="0" y="20" font-family="'Impact', 'Aachen-Bold', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ff007f" letter-spacing="8" filter="url(#neonGlow)">SHADOWRUN</text>

    <!-- 7th Edition Title -->
    <text x="0" y="85" font-family="'Impact', 'Aachen-Bold', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#cyberGlow)" letter-spacing="3" filter="url(#neonGlow)">7<tspan fill="#ffffff" font-size="48">TH</tspan> EDITION</text>

    <!-- Subtitle -->
    <text x="5" y="120" font-family="'FuturaBT-Medium', 'Futura', sans-serif" font-size="16" fill="#00ffcc" letter-spacing="5">CUSTOM UTILITIES &amp; SIMULATOR</text>
  </g>

  <!-- Cybernetic HUD Ring Widget on Right -->
  <g transform="translate(680, 100)" filter="url(#neonGlow)">
    <circle r="60" fill="none" stroke="#1a222d" stroke-width="4" />
    <circle r="50" fill="none" stroke="url(#cyberGlow)" stroke-width="2" stroke-dasharray="10 20 30 10" />
    <circle r="40" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="5 5" />
    <path d="M-30,-30 L-20,-30 L-30,-20 Z M30,30 L20,30 L30,20 Z" fill="#00ffcc" />
    <!-- Center text/glyph -->
    <text x="0" y="8" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">SR7</text>
  </g>
</svg>
